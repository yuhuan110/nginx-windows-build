name: Build nginx for Windows (x64)

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'nginx version'
        required: true
        default: '1.30.7'
      fd_setsize:
        description: 'FD_SETSIZE (1024 以上)'
        required: true
        default: '8192'
      pcre2_version:
        description: 'PCRE2 version'
        required: true
        default: '10.46'
      zlib_version:
        description: 'zlib version (zlib.net 当前根目录最新版)'
        required: true
        default: '1.4'
      openssl_version:
        description: 'OpenSSL version'
        required: true
        default: '3.0.14'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          distribution: strawberry

      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          NGINX_VER=${{ github.event.inputs.nginx_version }}
          PCRE_VER=${{ github.event.inputs.pcre2_version }}
          ZLIB_VER=${{ github.event.inputs.zlib_version }}
          SSL_VER=${{ github.event.inputs.openssl_version }}

          download() {
            curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$2" "$1"
            magic=$(xxd -l 2 -p "$2")
            if [ "$magic" = "1f8b" ]; then
              echo "OK $2"
            else
              echo "BADFILE $2 $magic"
              head -c 200 "$2"
              exit 1
            fi
          }

          # 1. nginx 本体
          download "https://nginx.org/download/nginx-${NGINX_VER}.tar.gz" nginx.tar.gz
          tar -xzf nginx.tar.gz
          mv "nginx-${NGINX_VER}" nginx
          cd nginx
          mkdir -p objs/lib

          # 2. PCRE2
          download "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE_VER}/pcre2-${PCRE_VER}.tar.gz" pcre2.tar.gz
          tar -xzf pcre2.tar.gz -C objs/lib

          # 3. zlib
          download "https://zlib.net/zlib-${ZLIB_VER}.tar.gz" zlib.tar.gz
          tar -xzf zlib.tar.gz -C objs/lib

          # 4. OpenSSL
          download "https://github.com/openssl/openssl/releases/download/openssl-${SSL_VER}/openssl-${SSL_VER}.tar.gz" openssl.tar.gz
          tar -xzf openssl.tar.gz -C objs/lib

          echo "objs/lib list:"
          ls -lh objs/lib
          echo "self check:"
          ls -l configure

      - name: Patch for Windows x64
        shell: bash
        run: |
          set -euo pipefail
          cd nginx

          # 1. 强制 OpenSSL 使用 VC-WIN64A (兼容不同版本 nginx 的 makefile.msvc)
          sed -i 's/\$(OPENSSL_TARGET)/VC-WIN64A/g; s/VC-WIN32/VC-WIN64A/g; s|ms\\do_ms|ms\\do_win64a|g' auto/lib/openssl/makefile.msvc

          # 2. 关闭 MSVC 将警告视为错误 (-WX)，避免新版编译器或 FD_SETSIZE 重定义警告中断编译
          sed -i 's/CFLAGS="\$CFLAGS -WX"/# CFLAGS="$CFLAGS -WX"/' auto/cc/msvc

          echo "--- auto/lib/openssl/makefile.msvc ---"
          cat auto/lib/openssl/makefile.msvc

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cd nginx
          PCRE_VER=${{ github.event.inputs.pcre2_version }}
          ZLIB_VER=${{ github.event.inputs.zlib_version }}
          SSL_VER=${{ github.event.inputs.openssl_version }}

          ./configure \
            --with-cc=cl \
            --prefix= \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --http-scgi-temp-path=temp/scgi_temp \
            --http-uwsgi-temp-path=temp/uwsgi_temp \
            --with-cc-opt=-DFD_SETSIZE=${{ github.event.inputs.fd_setsize }} \
            --with-pcre=objs/lib/pcre2-${PCRE_VER} \
            --with-zlib=objs/lib/zlib-${ZLIB_VER} \
            --with-openssl=objs/lib/openssl-${SSL_VER} \
            --with-openssl-opt=no-asm \
            --with-pcre-jit \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_stub_status_module \
            --with-http_realip_module \
            --with-http_gzip_static_module \
            --with-http_gunzip_module \
            --with-http_auth_request_module \
            --with-http_slice_module \
            --with-http_sub_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_realip_module

      - name: Build
        shell: cmd
        run: cd nginx && nmake -f objs/Makefile binary

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          cd nginx
          file ./objs/nginx.exe
          ./objs/nginx.exe -V

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/logs dist/temp
          cp nginx/objs/nginx.exe dist/
          cp -r nginx/conf dist/
          if [ -d nginx/docs/html ]; then
            cp -r nginx/docs/html dist/html
          fi
          cd dist
          7z a -tzip "../nginx-windows-fd${{ github.event.inputs.fd_setsize }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-windows-fd${{ github.event.inputs.fd_setsize }}
          path: nginx-windows-fd*.zip
          retention-days: 30
