name: Build nginx for Windows

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'nginx version'
        required: true
        default: '1.30.7'
      fd_setsize:
        description: 'FD_SETSIZE (突破1024)'
        required: true
        default: '4096'
      pcre2_version:
        description: 'PCRE2 version'
        required: true
        default: '10.46'
      zlib_version:
        description: 'zlib version'
        required: true
        default: '1.3.1'
      openssl_version:
        description: 'OpenSSL version'
        required: true
        default: '3.0.14'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Setup MSYS2 (provides sed/make)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: sed make

      - name: Download sources
        shell: bash
        run: |
          NGINX_VER=${{ github.event.inputs.nginx_version }}
          PCRE_VER=${{ github.event.inputs.pcre2_version }}
          ZLIB_VER=${{ github.event.inputs.zlib_version }}
          SSL_VER=${{ github.event.inputs.openssl_version }}

          curl -LO https://nginx.org/download/nginx-$NGINX_VER.tar.gz
          tar -xzf nginx-$NGINX_VER.tar.gz
          mv nginx-$NGINX_VER nginx
          cd nginx
          mkdir -p objs/lib

          curl -L -o pcre2.tar.gz https://github.com/PCRE2Project/pcre2/releases/download/pcre2-$PCRE_VER/pcre2-$PCRE_VER.tar.gz
          curl -L -o zlib.tar.gz  https://zlib.net/zlib-$ZLIB_VER.tar.gz
          curl -L -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-$SSL_VER/openssl-$SSL_VER.tar.gz

          tar -xzf pcre2.tar.gz   -C objs/lib
          tar -xzf zlib.tar.gz    -C objs/lib
          tar -xzf openssl.tar.gz -C objs/lib
          ls objs/lib

      - name: Patch MSVC version detection
        shell: bash
        working-directory: nginx
        run: |
          # 若新版 VS 导致 configure 无法识别编译器版本，取消下面注释并按实际版本改
          # sed -i 's/NGX_MSVC_VER=.*/NGX_MSVC_VER="19.40"/' auto/cc/msvc
          echo "skip if configure works"

      - name: Configure
        shell: bash
        working-directory: nginx
        run: |
          PCRE_VER=${{ github.event.inputs.pcre2_version }}
          ZLIB_VER=${{ github.event.inputs.zlib_version }}
          SSL_VER=${{ github.event.inputs.openssl_version }}

          auto/configure \
            --with-cc=cl \
            --prefix= \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --http-scgi-temp-path=temp/scgi_temp \
            --http-uwsgi-temp-path=temp/uwsgi_temp \
            --with-cc-opt=-DFD_SETSIZE=${{ github.event.inputs.fd_setsize }} \
            --with-pcre=objs/lib/pcre2-$PCRE_VER \
            --with-zlib=objs/lib/zlib-$ZLIB_VER \
            --with-openssl=objs/lib/openssl-$SSL_VER \
            --with-openssl-opt=no-asm \
            --with-http_ssl_module \
            --with-http_v2_module

      - name: Build
        shell: cmd
        working-directory: nginx
        run: nmake -f objs/Makefile

      - name: Verify build
        shell: bash
        working-directory: nginx
        run: |
          ./objs/nginx.exe -V

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp nginx/objs/nginx.exe dist/
          cp -r nginx/conf dist/
          cd dist
          zip -r nginx-windows-fd${{ github.event.inputs.fd_setsize }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-windows-fd${{ github.event.inputs.fd_setsize }}
          path: dist/*.zip
          retention-days: 30
